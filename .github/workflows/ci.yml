name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Fixtures à jour
        run: node packages/core/scripts/gen-fixtures.mjs && git diff --exit-code fixtures
      - name: Pas de tiret cadratin
        run: "! git grep -nI $'\\xe2\\x80\\x94' -- . ':!package-lock.json'"

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest ./python
      - run: pytest -q python/tests
