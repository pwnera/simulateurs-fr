name: Release

# Release Please tient une pull request de version à jour à partir des commits (Conventional Commits).
# La fusionner crée le tag et la release GitHub, puis publie npm, PyPI et le zip du skill.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp

  npm:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # publication de confiance (OIDC) et provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm 11.5+ pour la publication de confiance
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cp LICENSE packages/core/ && cp LICENSE packages/mcp/
      - run: npm publish -w packages/core -w packages/mcp --access public --provenance
        env:
          # Seulement pour la toute première publication, avant de déclarer le dépôt comme éditeur de confiance sur npmjs.com.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # éditeur de confiance PyPI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: cp LICENSE python/ && pip install build && python -m build python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  skill:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Le zip à importer dans claude.ai (Paramètres, Capacités, Skills), lié depuis calculsalairebrutnet.fr/integrer/ia.
      - run: cd skills && zip -r "$GITHUB_WORKSPACE/simulateurs-fr-skill.zip" simulateurs-fr
      - run: gh release upload "${{ needs.release-please.outputs.tag }}" simulateurs-fr-skill.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
